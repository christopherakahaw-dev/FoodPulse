<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4EF;--surface:#FFFFFF;--ink:#17201B;--muted:#56605A;--line:#DDE0D7;--line2:#ECEEE8;
  --hero:#17201B;--hero2:#2C3832;--hero3:#24302A;--heroText:#FFFFFF;--heroMuted:#C9D0CA;
  --risk:#FF9A62;--urgent:#B93C0A;--urgentText:#FFFFFF;--soon:#F6D9A8;--soonText:#6B3A00;
  --fine:#E4E8DF;--fineText:#3A443E;--good:#1F6B4A;--goodOnDark:#9FE0BE;--onInk:#FFFFFF;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512;--surface:#18201C;--ink:#E9EDE9;--muted:#A3ADA6;--line:#2A342F;--line2:#222B26;
  --hero:#22302A;--hero2:#2F3D36;--hero3:#2A3832;--soon:#4A3412;--soonText:#F6D9A8;
  --fine:#26302B;--fineText:#C9D0CA;--good:#7FD3A8;--onInk:#0F1512;
}}
:root[data-theme="dark"]{
  --bg:#0F1512;--surface:#18201C;--ink:#E9EDE9;--muted:#A3ADA6;--line:#2A342F;--line2:#222B26;
  --hero:#22302A;--hero2:#2F3D36;--hero3:#2A3832;--soon:#4A3412;--soonText:#F6D9A8;
  --fine:#26302B;--fineText:#C9D0CA;--good:#7FD3A8;--onInk:#0F1512;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--risk);outline-offset:2px}
[hidden]{display:none!important}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* screens */
#screens{position:absolute;inset:0 0 72px 0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:20px 20px 112px;display:flex;flex-direction:column;gap:18px;
  transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .3s ease}
.screen.off-left{transform:translateX(-22%);opacity:0;pointer-events:none}
.screen.off-right{transform:translateX(22%);opacity:0;pointer-events:none}
.screen.no-anim{transition:none}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1.1}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.sub{font-size:13px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.section-label .mono{font-family:var(--mono)}

/* hero */
.hero{background:var(--hero);color:var(--heroText);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--heroMuted);font-weight:500}
.hero-count{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--hero2);color:#E9EDE9}
.hero-amount{font-family:var(--mono);font-weight:600;font-size:44px;letter-spacing:-1px;color:var(--risk);line-height:1}
.hero-amount.calm{color:var(--goodOnDark)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--hero2);transform-origin:left center}
.bar.grow{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero-cta{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 16px;border-radius:14px;border:none;background:#FFFFFF;color:#17201B;font-weight:600;font-size:15px;width:100%}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.tag{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:500}

/* rows */
.group{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.row.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--risk)}100%{box-shadow:0 0 0 0 transparent}}
.pill{width:58px;flex-shrink:0;padding:6px 0;border-radius:10px;text-align:center;font-size:12px;font-weight:600;line-height:1.2}
.p-urgent{background:var(--urgent);color:var(--urgentText)}
.p-soon{background:var(--soon);color:var(--soonText)}
.p-fine{background:var(--fine);color:var(--fineText)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:13px;color:var(--muted)}
.row-val{font-family:var(--mono);font-weight:600;font-size:15px}
.row-val.hot{color:var(--urgent)}
.row-val.cool{color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--mono);font-size:18px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.empty{align-items:flex-start}
.empty p{margin:0;color:var(--muted)}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.btn.hot{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn,.chip,.row,.icon-btn,.hero-cta,.tab,#mic{transition:transform .12s ease}
.btn:active,.chip:active,.row:active,.icon-btn:active,.hero-cta:active,.tab:active{transform:scale(.97)}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link-btn{border:none;background:none;padding:8px 0;color:var(--urgent);font-weight:600;font-size:14px;text-align:left}

/* add screen */
.entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.entry-ico{width:44px;height:44px;border-radius:12px;background:var(--fine);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.entry b{display:block;font-size:16px}
.scan-view{position:relative;border-radius:20px;overflow:hidden;background:#0E1411;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.scan-view img{max-width:100%;max-height:100%;object-fit:contain;opacity:.85}
.scan-line{position:absolute;left:8%;right:8%;height:3px;border-radius:2px;background:var(--risk);box-shadow:0 0 14px 3px rgba(255,154,98,.6);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{top:8%}50%{top:90%}100%{top:8%}}
.scan-view.cam{aspect-ratio:3/4;max-height:62vh}
.scan-view video{width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;inset:7% 9%;border:2px dashed rgba(255,255,255,.55);border-radius:14px;pointer-events:none}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.shutter{width:72px;height:72px;border-radius:36px;border:4px solid var(--ink);background:var(--urgent);box-shadow:inset 0 0 0 4px var(--bg)}
.shutter:disabled{opacity:.5}
.scan-status{position:absolute;top:12px;left:12px;padding:8px 12px;border-radius:999px;background:var(--risk);color:#17201B;font-size:13px;font-weight:600}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.review{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rv{display:grid;grid-template-columns:28px minmax(0,1fr) 78px;gap:8px 10px;padding:12px 14px;border-bottom:1px solid var(--line2);align-items:center}
.rv:last-child{border-bottom:none}
.rv input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.rv .rv-name{font-weight:600;border:none;background:transparent;padding:4px 0;width:100%;min-width:0}
.rv .rv-price{font-family:var(--mono);text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);width:100%}
.rv .rv-meta{grid-column:2 / 4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rv select,.rv .rv-days{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--bg);font-size:13px}
.rv .rv-days{width:56px;font-family:var(--mono)}
.rv.unsure{background:color-mix(in srgb,var(--soon) 35%,var(--surface))}
.rv.off{opacity:.5}

/* meals */
.meal-uses{display:flex;flex-direction:column;gap:6px}
.meal-use{display:flex;justify-content:space-between;font-size:14px}
.meal-use span:first-child{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.meal-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:center}
.meal-save{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--good)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
details ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.recipe summary{color:var(--ink);min-height:40px;display:flex;align-items:center}
ol.steps{gap:14px;margin-top:12px;padding-left:22px}
ol.steps li{display:flex;flex-direction:column;gap:3px;padding-left:4px}
ol.steps li::marker{font-family:var(--mono);font-weight:600;color:var(--urgent)}
.timer{align-self:flex-start;margin-top:4px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:13px;font-weight:600}
.timer.running{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--ink);flex-shrink:0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--urgent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--urgent);font-weight:500}

/* mic + nav */
#mic{position:absolute;right:16px;bottom:88px;height:60px;padding:0 22px 0 18px;border-radius:30px;border:none;background:var(--urgent);color:#fff;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(23,32,27,.28);z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#mic.holding{transform:scale(1.06)}
#mic.away{transform:scale(.6);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
nav.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--good)}
.live span{width:8px;height:8px;border-radius:4px;background:var(--good);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
input.base{padding:8px 10px;font-family:var(--mono);font-size:15px}
#mic.hide{transform:scale(.6);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));z-index:4}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab svg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tab[aria-selected="true"] svg{transform:translateY(-2px)}

/* sheets */
#scrim{position:absolute;inset:0;background:rgba(10,15,12,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px 28px;z-index:9;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;gap:16px}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex-shrink:0}
.sheet.dark{background:var(--hero);color:var(--heroText);min-height:78%}
.sheet.dark .grab{background:var(--hero2)}
.sheet.dark .icon-btn{background:var(--hero2);border-color:var(--hero2);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-size:16px;font-weight:400;color:var(--ink)}
.field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onInk);border-color:var(--ink)}

/* voice */
.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:64px}
.wave i{display:block;width:5px;border-radius:3px;background:var(--risk);transform-origin:center;animation:wv .7s ease-in-out infinite alternate}
.wave i:nth-child(3n){animation-delay:-.25s;animation-duration:.6s}
.wave i:nth-child(3n+1){animation-delay:-.5s;animation-duration:.85s}
.wave i:nth-child(4n){animation-delay:-.1s}
.wave.still i{animation-play-state:paused;opacity:.35}
@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.transcript{margin:0;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;min-height:30px}
.transcript.placeholder{color:var(--heroMuted)}
.vs-status{font-size:13px;color:var(--heroMuted)}
.change{display:flex;align-items:center;gap:12px;background:var(--hero3);border-radius:16px;padding:12px 14px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.change .ck{width:34px;height:34px;border-radius:17px;background:var(--hero2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.change .row-meta{color:var(--heroMuted)}
.change .eff{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--goodOnDark);text-align:right}
.change .eff.bad{color:var(--risk)}
.sheet.dark textarea{background:var(--hero3);border-color:var(--hero2);color:#fff}
.sheet.dark .btn{background:var(--hero2);border-color:var(--hero2);color:#fff}
.sheet.dark .btn.light{background:#fff;color:#17201B;border-color:#fff}
.sheet.dark .note{color:var(--heroMuted)}
.sheet.dark .err{color:var(--risk)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--hero3)}
.sum-row b{font-family:var(--mono);font-size:18px;color:var(--goodOnDark)}

/* toast */
#toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:12;background:var(--ink);color:var(--onInk);border-radius:16px;padding:12px 14px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast button{border:none;background:none;color:var(--risk);font-weight:600;min-height:36px;padding:0 6px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="screens">
    <section class="screen" id="s-pantry" aria-label="Pantry"></section>
    <section class="screen off-right" id="s-add" aria-label="Add groceries" inert></section>
    <section class="screen off-right" id="s-meals" aria-label="Meals" inert></section>
    <section class="screen off-right" id="s-market" aria-label="Market demand" inert></section>
  </main>

  <button id="mic" aria-label="Log a kitchen change by voice. Hold to talk, or tap.">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span>Hold to log</span>
  </button>

  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="0" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 10h16M8 6.5v1M8 13.5v2"/></svg>Pantry</button>
    <button class="tab" role="tab" data-tab="1" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8M8 12h8M8 15h5"/></svg>Add</button>
    <button class="tab" role="tab" data-tab="2" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16a8 8 0 0 1-16 0zM9 9c0-2 2-2 2-4M14 9c0-2 2-2 2-4"/></svg>Meals</button>
    <button class="tab" role="tab" data-tab="3" aria-selected="false" id="tab-market" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Market</button>
  </nav>

  <div id="scrim"></div>

  <div class="sheet dark" id="voice" role="dialog" aria-modal="true" aria-label="Voice log" inert>
    <div class="grab"></div>
    <div class="head" style="align-items:center">
      <span class="vs-status" id="vs-status" aria-live="polite">Listening</span>
      <button class="icon-btn" id="vs-close" aria-label="Close voice log"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <p class="transcript placeholder" id="vs-text">Say what changed, like “used the spinach and two eggs”</p>
    <div id="vs-type" hidden>
      <textarea id="vs-input" aria-label="Type what changed" placeholder="Used the spinach and 2 eggs, froze the chicken, out of milk"></textarea>
    </div>
    <div id="vs-msg"></div>
    <div id="vs-changes" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="vs-actions" style="margin-top:auto;display:flex;flex-direction:column;gap:10px"></div>
  </div>

<script>
(function(){
'use strict';
const $ = (s, r) => (r || document).querySelector(s);

const uid = () => Math.random().toString(36).slice(2, 10);
const LOCS = ['fridge', 'freezer', 'pantry'];
const DEFAULT_DAYS = { fridge: 5, freezer: 90, pantry: 60 };
const ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF9A62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

/* ---------- dates ---------- */
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }

/* ---------- state ---------- */
const KEY = 'foodpulse:v1';
let S = { items: [], log: [], shopping: [], updatedAt: 0 };

let ui = { tab: 0, view: 'expiry', meals: null, mealsNote: '', basics: true, review: null, flash: new Set(), access: null, photo: null };

function save() {

}
function snapshot() { return JSON.stringify(S); }
function restore(snap) { S = JSON.parse(snap); save(); renderAll(); }

const isUseFirst = i => !!i.useFirst || daysLeft(i.expires) <= 2;
const useFirstItems = () => S.items.filter(isUseFirst).sort((a, b) => daysLeft(a.expires) - daysLeft(b.expires));
function logEvent(type, value, name, cat) { S.log.push({ type, value: Math.max(0, +value || 0), name, cat: CATS[cat] ? cat : 'other', at: Date.now() }); if (S.log.length > 1500) S.log = S.log.slice(-1500); }

}
function findItem(id) { return S.items.find(i => i.id === id); }
function removeItem(id) { S.items = S.items.filter(i => i.id !== id); }
const CATS = { produce: 'Fruit & veg', dairy: 'Dairy & eggs', meat: 'Meat & seafood', bakery: 'Bakery', frozen: 'Frozen', pantry: 'Pantry staples', drinks: 'Drinks', other: 'Other' };
const CAT_WORDS = {
  meat: /chicken|beef|pork|lamb|mince|steak|thigh|breast|bacon|ham|sausage|salmon|fish|prawn|shrimp|tuna|cod|seafood|turkey|duck|squid|crab|mussel/,
  dairy: /milk|yogurt|yoghurt|cheese|cheddar|butter|cream|egg|feta|mozzarella|parmesan|tofu|kefir/,
  bakery: /bread|loaf|bun|roll|bagel|croissant|baguette|wrap|tortilla|pita|muffin|cake|pastry/,
  drinks: /juice|soda|cola|water|coffee|tea|beer|wine|drink|kombucha/,
  pantry: /rice|pasta|noodle|flour|sugar|oil|sauce|vinegar|cereal|oat|bean|lentil|can|tin|spice|salt|honey|jam|stock|biscuit|cracker|chip|nut/,
  produce: /spinach|lettuce|kale|cabbage|tomato|onion|garlic|potato|carrot|capsicum|pepper|mushroom|apple|banana|orange|lemon|lime|berr|grape|mango|avocado|cucumber|broccoli|coriander|cilantro|herb|basil|parsley|chilli|chili|ginger|corn|pea|choy|zucchini|courgette|eggplant|aubergine|pear|melon|fruit|veg|salad|celery|leek|scallion/
};
function classify(name, loc) {
  const n = String(name || '').toLowerCase();
  if (loc === 'freezer' || /frozen/.test(n)) return 'frozen';
  for (const c of ['meat', 'dairy', 'bakery', 'drinks', 'produce', 'pantry']) if (CAT_WORDS[c].test(n)) return c;
  return loc === 'pantry' ? 'pantry' : 'other';
}
const catOf = i => (i && CATS[i.cat]) ? i.cat : classify(i && i.name, i && i.location);
function newItem(o) {
  const loc = LOCS.includes(o.location) ? o.location : 'fridge';
  return { id: uid(), name: String(o.name || 'Item').slice(0, 60), qty: String(o.qty || '').slice(0, 30), location: loc,
    price: Math.max(0, +o.price || 0), expires: validDate(o.expires) ? o.expires : addDays(o.shelfDays > 0 ? o.shelfDays : DEFAULT_DAYS[loc]),
    useFirst: false, addedAt: Date.now(), cat: CATS[o.category] ? o.category : classify(o.name, loc) };
}

/* ---------- Claude ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
function errCopy(e) {

  if (c === 'rate_limited') return 'Too many requests at once. Wait a moment and try again.';
  if (c === 'image_rejected') return 'That photo couldn’t be read. Try a clearer, well-lit shot of the whole receipt.';
  if (c === 'images_unavailable') return 'Photo reading isn’t available here. Import the order text or add items by hand.';
  if (c === 'invalid_json') return 'The answer came back garbled. Try again.';
  if (c === 'prompt_too_large') return 'That’s too much text. Paste just the item list.';
  if (c === 'session_expired') return 'Your session expired. Reload the page and try again.';

}

/* ---------- access to Claude features ---------- */
let permsNS = null;

      const sample = await getSample();

      else { const lim = await sample.limits().catch(() => null); ui.photo = !!(lim && lim.images); }

}

    prompt: ['Turn on receipt reading and meal ideas', 'These use Claude on your account. Allow it once and they work from then on.', 'Turn on'],
    denied: ['Receipt reading and meal ideas are switched off', 'Claude access was declined for this page. Switch it back on in Permissions.', 'Open permissions'],
    unavailable: ['Receipt reading and meal ideas aren’t available here', 'Open Food Pulse from claude.ai, signed in, to use them.', '']
  }[a] || null;
  if (!copy) return '';
  return '<div class="card" style="border-color:var(--urgent)"><h2 style="font-size:17px">' + copy[0] + '</h2><p class="note" style="margin:0">' + copy[1] + '</p>' +
    (copy[2] ? '<button class="btn primary block" data-access>' + copy[2] + '</button>' : '') + '<p class="err" id="access-err" hidden></p></div>';
}
function bindAccess(root) {

/* ---------- toast ---------- */
let toastTimer = null;

}

/* ---------- tabs with transitions ---------- */
const screens = ['#s-pantry', '#s-add', '#s-meals', '#s-market'];
function goTab(n) {
  if (n === ui.tab) { $(screens[n]).scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const from = $(screens[ui.tab]), to = $(screens[n]), fwd = n > ui.tab;
  to.classList.add('no-anim'); to.classList.remove('off-left', 'off-right'); to.classList.add(fwd ? 'off-right' : 'off-left');
  void to.offsetWidth; to.classList.remove('no-anim');
  requestAnimationFrame(() => {
    from.classList.add(fwd ? 'off-left' : 'off-right'); from.setAttribute('inert', '');
    to.classList.remove('off-left', 'off-right'); to.removeAttribute('inert');
  });

/* ---------- sheets ---------- */
let openSheet = null;
function showSheet(el) {

}

document.addEventListener('keydown', e => { if (e.key === 'Escape') hideSheet(); });

/* ---------- PANTRY ---------- */
function pillFor(i) {
  const d = daysLeft(i.expires);
  if (i.location === 'freezer' && d > 30) return ['Frozen', 'p-fine'];
  if (d < 0) return ['Past', 'p-urgent'];
  if (d === 0) return ['Today', 'p-urgent'];
  if (d <= 2) return [d + (d === 1 ? ' day' : ' days'), 'p-soon'];
  if (d <= 30) return [d + ' days', 'p-fine'];
  return [Math.round(d / 7) + ' wk', 'p-fine'];
}
function rowHTML(i) {
  const [label, cls] = pillFor(i), d = daysLeft(i.expires);
  const meta = [i.location.charAt(0).toUpperCase() + i.location.slice(1), i.qty, i.useFirst ? 'flagged use-first' : ''].filter(Boolean).join(', ');
  const vcls = d <= 0 ? 'hot' : d > 7 ? 'cool' : '';
  return '<button class="row' + (ui.flash.has(i.id) ? ' flash' : '') + '" data-id="' + i.id + '" aria-label="' + esc(i.name + ', ' + label + ', ' + money(i.price)) + '">' +
    '<span class="pill ' + cls + '">' + label + '</span>' +
    '<span class="row-main"><span class="row-name">' + esc(i.name) + '</span><span class="row-meta">' + esc(meta) + '</span></span>' +
    '<span class="row-val ' + vcls + '">' + money(i.price) + '</span></button>';
}

  if (!list.length) return '';

  return '<div class="group"><div class="section-label"><span>' + label + '</span><span class="mono">' + money(sum) + '</span></div>' + list.map(rowHTML).join('') + '</div>';
}
let lastRisk = null;
function renderPantry() {
  const el = $('#s-pantry');
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
  let h = '<div class="head"><div><div class="sub">' + esc(dateStr) + '</div><h1>Your kitchen</h1></div>' +
    '<button class="icon-btn" id="add-item" aria-label="Add an item by hand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>';

  if (!S.items.length) {
    h += '<div class="card empty"><h2>Nothing tracked yet</h2><p>Scan a receipt, import an online order, or hold the mic and say what you bought.</p>' +
      '<div class="btn-row" style="width:100%"><button class="btn primary" id="go-add">Add groceries</button><button class="btn" id="load-sample">Try sample kitchen</button></div></div>';
    el.innerHTML = h + statsHTML() + shoppingHTML() + shareCardHTML(); bindPantry(); return;
  }

  const uf = useFirstItems(), risk = uf.reduce((a, i) => a + i.price, 0);
  h += '<div class="hero"><div class="hero-top"><span>' + (uf.length ? 'Use-first value at risk' : 'Nothing needs using first') + '</span><span class="hero-count">' + uf.length + ' use-first</span></div>' +
    '<div class="hero-amount' + (uf.length ? '' : ' calm') + '" id="risk-amt">' + money(risk) + '</div>';
  if (uf.length) {
    h += '<div class="bar grow" aria-hidden="true">' + uf.map(i => '<div style="flex:' + Math.max(i.price, .3) + ';background:' + (daysLeft(i.expires) <= 0 ? 'var(--risk)' : '#F6C48F') + '"></div>').join('') + '</div>' +
      '<button class="hero-cta" id="cook-cta"><span>Cook with these first</span>' + ICON_ARROW + '</button>';
  }
  h += '</div>';

  const views = [['expiry', 'By expiry'], ['value', 'By value'], ['fridge', 'Fridge'], ['freezer', 'Freezer'], ['pantry', 'Pantry']];
  h += '<div class="chips" role="group" aria-label="Sort and filter">' + views.map(v => '<button class="chip" data-view="' + v[0] + '" aria-pressed="' + (ui.view === v[0]) + '">' + v[1] + '</button>').join('') + '</div>';

  let items = S.items.slice();
  if (LOCS.includes(ui.view)) items = items.filter(i => i.location === ui.view);
  if (ui.view === 'value') {
    items.sort((a, b) => b.price - a.price);
    h += '<div class="group">' + items.map(rowHTML).join('') + '</div>';
  } else {
    items.sort((a, b) => daysLeft(a.expires) - daysLeft(b.expires) || b.price - a.price);
    const g = { past: [], today: [], soon: [], week: [], later: [] };
    items.forEach(i => { const d = daysLeft(i.expires); (d < 0 ? g.past : d === 0 ? g.today : d <= 2 ? g.soon : d <= 7 ? g.week : g.later).push(i); });
    const flagged = g.week.concat(g.later).filter(i => i.useFirst);
    g.week = g.week.filter(i => !i.useFirst); g.later = g.later.filter(i => !i.useFirst);
    h += groupHTML('Past their date', g.past) + groupHTML('Use today', g.today) + groupHTML('Next 2 days', g.soon) +
      groupHTML('Flagged to use first', flagged) + groupHTML('This week', g.week) + groupHTML('Later', g.later);
    if (!items.length) h += '<p class="note">Nothing in the ' + esc(ui.view) + '.</p>';
  }
  el.innerHTML = h + statsHTML() + shoppingHTML() + shareCardHTML();
  bindPantry();
  const amt = $('#risk-amt');

}
function countUp(el, from, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now(), dur = 600;
  (function step(t) { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = money(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); })(t0);
}
function statsHTML() {
  const m = monthTotals();
  if (!m.used && !m.wasted) return '';
  return '<div class="stats"><div class="stat"><span class="sub">Used this month</span><b style="color:var(--good)">' + money(m.used) + '</b></div>' +
    '<div class="stat"><span class="sub">Thrown out this month</span><b style="color:var(--urgent)">' + money(m.wasted) + '</b></div></div>';
}

    S.shopping.map((s, k) => '<label class="rv" style="grid-template-columns:28px 1fr"><input type="checkbox" data-shop="' + k + '" aria-label="Got ' + esc(s) + '"><span>' + esc(s) + '</span></label>').join('') + '</div></div>';
}
function bindPantry() {

  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { ui.view = c.dataset.view; renderPantry(); }));
  el.querySelectorAll('[data-shop]').forEach(c => c.addEventListener('change', () => {
    const k = +c.dataset.shop, name = S.shopping[k]; c.closest('label').style.opacity = .4;

  }));

  const c = $('#cook-cta'); if (c) c.onclick = () => goTab(2);

function loadSample() {
  const mk = (name, qty, location, price, days) => Object.assign(newItem({ name, qty, location, price }), { expires: addDays(days) });
  S.items = [mk('Chicken thighs', '600 g', 'fridge', 9.8, 0), mk('Baby spinach', 'opened bag', 'fridge', 4.2, 0), mk('Greek yogurt', '500 g', 'fridge', 5.6, 1),
    mk('Coriander', '1 bunch', 'fridge', 1.5, 1), mk('Button mushrooms', '250 g', 'fridge', 3.9, 2), mk('Red capsicum', 'half', 'fridge', 1.4, 2),
    mk('Eggs', '6', 'fridge', 3.2, 5), mk('Cheddar', '200 g', 'fridge', 6.5, 6), mk('Jasmine rice', '1 kg', 'pantry', 4.8, 300), mk('Frozen peas', '500 g', 'freezer', 2.9, 120)];

/* ---------- ITEM SHEET ---------- */
function openItem(id) {

    '<label class="field">Name<input id="f-name" value="' + esc(d.name) + '" placeholder="e.g. Baby spinach" autocomplete="off"></label>' +

    '<p class="err" id="f-err" hidden></p>' +
    (it ? '<div class="btn-row"><button class="btn" id="it-used">Used it all</button><button class="btn" id="it-waste">Threw it out</button></div><button class="btn primary block" id="it-save">Save changes</button><button class="link-btn" id="it-del" style="color:var(--muted)">Remove without logging</button>'

    const t = tallies(ws); if (!t.n) continue;
    if (!S.share.tokens[ws]) { S.share.tokens[ws] = uid() + uid() + uid(); newTok = true; }
    const body = { weekStart: ws, region: S.share.region || 'unspecified', cats: t.cats, v: 1 }, js = JSON.stringify(body);
    if (lastSent[ws] === js) continue;
    try { await DB.collection('signals').doc(S.share.tokens[ws]).set(body); lastSent[ws] = js; } catch (e) {}
  }
  const cutoff = weekStart(now - 70 * 864e5);
  Object.keys(S.share.tokens).forEach(ws => { if (ws < cutoff) { delete S.share.tokens[ws]; newTok = true; } });

}
function shareCardHTML() {
  if (!DB) return '';

  return '<div class="card"><h2 style="font-size:17px">' + (on ? 'Sharing anonymous trends' : 'Help local stores waste less') + '</h2>' +
    '<p class="note" style="margin:0">' + (on ? 'Weekly category totals' + (S.share.region ? ' for the ' + esc(S.share.region) + ' area' : '') + '. No item names and no account details.' : 'Share anonymous weekly totals so grocers can order closer to what households actually use.') + '</p>' +
    '<button class="btn block" id="share-open">' + (on ? 'Manage sharing' : 'See what’s shared') + '</button></div>';
}
function openShare() {

    '<button class="icon-btn" id="sh-close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<p style="margin:0">Each week Food Pulse sends totals by food type, like “fruit &amp; veg: $24 bought, $19 used, $5 thrown out”, plus the area you choose.</p>' +
    '<p class="note" style="margin:0">It never sends item names, your account, or when you logged things. Each week gets a new random ID, so a store can’t link one week to the next. Stores only see an area once at least ' + MIN_HH + ' households share there. Only what you log from now on is included.</p>' +
    '<div class="field">Your area<div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" id="sh-reg">' +
    REGIONS.concat(['']).map(r => '<button type="button" data-reg="' + r + '" aria-pressed="' + (region === r) + '">' + (r || 'Don’t say') + '</button>').join('') + '</div></div>' +
    '<button class="btn primary block" id="sh-go">' + (on ? 'Save area' : 'Start sharing') + '</button>' +
    (on ? '<button class="btn block" id="sh-stop">Stop sharing and delete what I sent</button>' : '<button class="btn block" id="sh-no">Not now</button>');

  $('#sh-close').onclick = hideSheet;

    S.share = Object.assign({ tokens: {} }, S.share || {}, { on: true, region, since: (was && S.share.since) || Date.now() });
    Object.keys(lastSent).forEach(k => delete lastSent[k]);

  };

    await Promise.all(toks.map(t => DB.collection('signals').doc(t).delete().catch(() => {})));
    S.share = { on: false, region: S.share.region, since: 0, tokens: {} }; save(); hideSheet(); renderPantry(); toast('Stopped sharing. Your weekly totals were deleted.');
  };
  showSheet(sh);
}

/* ---------- MARKET (operator side) ---------- */
const M = { src: 'live', region: 'all', live: null, unsub: null, err: '', baselines: {}, sim: null, baseRef: null, baseTimer: null };
async function startMarket() {
  if (!DB || M.unsub) return;
  const start = weekStart(Date.now() - 9 * 7 * 864e5);
  try {
    M.unsub = DB.collection('signals').where('weekStart', '>=', start).limit(1000).onSnapshot(
      snap => { M.live = snap.docs.map(d => d.data()).filter(Boolean); M.err = ''; if (ui.tab === 3) renderMarket(); },
      e => { M.err = 'Live data stopped (' + ((e && e.code) || 'error') + '). Reload the page to reconnect.'; M.unsub = null; if (ui.tab === 3) renderMarket(); });
  } catch (e) { M.err = 'Couldn’t read shared data.'; }
  try {
    M.baseRef = DB.doc('operator/settings');
    const s = await M.baseRef.get(); if (s.exists) { M.baselines = Object.assign({}, (s.data() || {}).baselines || {}); if (ui.tab === 3) renderMarket(); }
  } catch (e) {}
}
function saveBaselines() {
  if (!M.baseRef) return; clearTimeout(M.baseTimer);
  M.baseTimer = setTimeout(() => M.baseRef.set({ baselines: M.baselines }).catch(() => {}), 900);
}
function weekList() { const out = []; for (let k = 8; k >= 0; k--) out.push(weekStart(Date.now() - k * 7 * 864e5)); return out; }
function genSim() {
  if (M.sim) return M.sim;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const base = { produce: 18, dairy: 12, meat: 21, bakery: 7, frozen: 8, pantry: 14, drinks: 9, other: 4 };
  const waste = { produce: .22, dairy: .12, meat: .08, bakery: .19, frozen: .03, pantry: .04, drinks: .02, other: .06 };
  const trend = { produce: .10, dairy: -.04, meat: .06, bakery: -.08, frozen: .12, pantry: .02, drinks: .15, other: 0 };
  const weeks = weekList(), dow = ((new Date().getDay() + 6) % 7 + 1) / 7, docs = [];
  REGIONS.forEach((reg, ri) => {
    const n = 18 + Math.floor(rnd() * 22);
    for (let h = 0; h < n; h++) {
      const f = .5 + rnd() * 1.1;
      weeks.forEach((ws, wi) => {
        if (rnd() < .08) return;
        const cats = {}, part = wi === 8 ? dow : 1;
        Object.keys(base).forEach(c => {
          if (rnd() < .15) return;
          const b = base[c] * f * (1 + trend[c] * wi / 8) * (.75 + rnd() * .5) * (1 + (ri - 2) * .04) * part;
          const w = b * waste[c] * (.5 + rnd());
          cats[c] = { bought: r2(b), wasted: r2(w), used: r2(Math.max(0, b - w) * (.9 + rnd() * .15)) };
        });
        docs.push({ weekStart: ws, region: reg, cats });
      });
    }
  });
  return (M.sim = docs);
}
function aggregate(docs, region) {
  const weeks = weekList(), idx = {}; weeks.forEach((w, k) => idx[w] = k);
  const hh = weeks.map(() => 0), cats = {};
  docs.forEach(d => {
    if (!d || !(d.weekStart in idx) || (region !== 'all' && d.region !== region) || !d.cats) return;
    const k = idx[d.weekStart]; hh[k]++;
    Object.keys(d.cats).forEach(c => {
      if (!CATS[c]) return; const o = d.cats[c] || {};
      cats[c] = cats[c] || { bought: weeks.map(() => 0), used: weeks.map(() => 0), wasted: weeks.map(() => 0) };
      cats[c].bought[k] += +o.bought || 0; cats[c].used[k] += +o.used || 0; cats[c].wasted[k] += +o.wasted || 0;
    });
  });
  return { weeks, hh, cats };
}
function holt(y) {
  let l = y[0], b = y.length > 1 ? y[1] - y[0] : 0; const a = .5, be = .3, res = [];
  for (let t = 1; t < y.length; t++) { const f = l + b; res.push(y[t] - f); const nl = a * y[t] + (1 - a) * (l + b); b = be * (nl - l) + (1 - be) * b; l = nl; }
  const sd = res.length > 1 ? Math.sqrt(res.reduce((s, r) => s + r * r, 0) / res.length) : 0;
  return { f: Math.max(0, l + b), range: 1.28 * sd };
}
const money0 = n => '$' + Math.round(n).toLocaleString();
function spark(series, f) {
  const pts = series.map((v, k) => [k, v]).filter(p => p[1] != null), all = pts.map(p => p[1]).concat([f]);
  const max = Math.max(...all) || 1, min = Math.min(...all), W = 240, H = 48, X = k => 6 + k * (W - 12) / 8, Y = v => H - 6 - (v - min) / ((max - min) || 1) * (H - 12);
  const line = pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' '), last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="48" aria-hidden="true" preserveAspectRatio="none"><polyline points="' + line + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>' +
    '<line x1="' + X(last[0]) + '" y1="' + Y(last[1]) + '" x2="' + X(8) + '" y2="' + Y(f) + '" stroke="var(--urgent)" stroke-width="2" stroke-dasharray="4 4"/><circle cx="' + X(8) + '" cy="' + Y(f) + '" r="4" fill="var(--urgent)"/></svg>';
}
function renderMarket() {
  const el = $('#s-market'); if (!el) return;
  let h = '<div class="head"><div><div class="sub">For food operators</div><h1>Market demand</h1></div>' +
    (M.src === 'live' && M.live ? '<span class="live"><span></span>Live</span>' : '') + '</div>';
  h += '<div class="chips" role="group" aria-label="Data source"><button class="chip" data-src="live" aria-pressed="' + (M.src === 'live') + '">Live households</button><button class="chip" data-src="sim" aria-pressed="' + (M.src === 'sim') + '">Simulated market</button></div>';
  h += '<div class="chips" role="group" aria-label="Area">' + ['all'].concat(REGIONS).map(r => '<button class="chip" data-reg="' + r + '" aria-pressed="' + (M.region === r) + '">' + (r === 'all' ? 'All areas' : r) + '</button>').join('') + '</div>';
  if (M.src === 'sim') h += '<p class="note" style="margin:0">Simulated: about a hundred made-up households, for trying out the forecasts. Nothing here is real.</p>';
  if (M.err) h += '<p class="err">' + esc(M.err) + '</p>';
  const docs = M.src === 'sim' ? genSim() : M.live;
  if (!docs) { el.innerHTML = h + '<div class="thinking"><span class="spinner"></span>Loading shared data…</div>'; bindMarket(); return; }
  const A = aggregate(docs, M.region), full = [0, 1, 2, 3, 4, 5, 6, 7], ok = full.filter(k => A.hh[k] >= MIN_HH);
  if (ok.length < 3) {
    h += '<div class="card empty"><h2>Not enough households yet</h2><p>' + A.hh[8] + ' household' + (A.hh[8] === 1 ? '' : 's') + ' shared this week' + (M.region === 'all' ? '' : ' in ' + esc(M.region)) +
      '. Forecasts appear once ' + MIN_HH + ' or more households have shared for at least 3 weeks. Weeks with fewer are hidden to protect privacy.</p>' +
      (M.src === 'live' ? '<button class="btn primary" data-src="sim">Preview with simulated data</button>' : '') + '</div>';
    el.innerHTML = h; bindMarket(); return;
  }
  const lastK = ok[ok.length - 1], last4 = ok.slice(-4);
  const sum = (arr, ks) => ks.reduce((s, k) => s + arr[k], 0);
  let totBought = 0, totUsed = 0, totWaste = 0;
  Object.values(A.cats).forEach(c => { totBought += c.bought[lastK]; totUsed += sum(c.used, last4); totWaste += sum(c.wasted, last4); });
  const rows = Object.keys(A.cats).map(c => {
    const C = A.cats[c], y = ok.map(k => C.bought[k]);
    const fc = holt(y), avg = sum(C.bought, last4) / last4.length || 0, idx = avg ? fc.f / avg : 1;
    const used = sum(C.used, last4), wst = sum(C.wasted, last4), wr = used + wst ? wst / (used + wst) : 0;
    const adj = idx * (1 - .5 * Math.max(0, wr - .10));
    return { c, C, fc, avg, idx, wr, adj, last: C.bought[lastK] };
  }).sort((a, b) => b.last - a.last);
  let base = 0, rec = 0; rows.forEach(r => { const b = +M.baselines[r.c]; if (b > 0) { base += b; rec += b * r.adj; } });
  h += '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><span class="sub">Households last week</span><b>' + A.hh[lastK] + '</b></div>' +
    '<div class="stat"><span class="sub">Spend last week</span><b>' + money0(totBought) + '</b></div>' +
    '<div class="stat"><span class="sub">Thrown out, 4 wks</span><b style="color:var(--urgent)">' + Math.round(100 * totWaste / ((totUsed + totWaste) || 1)) + '%</b></div></div>';
  if (base > 0) h += '<div class="hero" style="gap:6px"><div class="hero-top"><span>Suggested orders for next week</span></div><div class="hero-amount' + (rec <= base ? ' calm' : '') + '" style="font-size:34px">' + money0(rec) + '</div><span style="font-size:14px;color:#E9EDE9">' +
    (rec < base ? money0(base - rec) + ' less than your usual ' + money0(base) + ', less stock likely to go unsold' : money0(rec - base) + ' more than your usual ' + money0(base) + ', demand is rising') + '</span></div>';
  else h += '<p class="note" style="margin:0">Enter your usual weekly order for a category to get a suggested amount.</p>';
  h += rows.map((r, k) => {
    const pct = Math.round((r.idx - 1) * 100), apct = Math.round((r.adj - 1) * 100), b = +M.baselines[r.c] || '';
    const series = [0, 1, 2, 3, 4, 5, 6, 7].map(i => A.hh[i] >= MIN_HH ? r.C.bought[i] : null);
    return '<div class="card" style="gap:10px;animation:rise .4s cubic-bezier(.2,.8,.2,1) ' + (k * .05) + 's both"><div class="head" style="align-items:baseline"><h2 style="font-size:18px">' + CATS[r.c] + '</h2><span class="row-val">' + money0(r.fc.f) + '</span></div>' +
      spark(series, r.fc.f) +
      '<span class="note">Next week about ' + money0(r.fc.f) + (r.fc.range ? ' (±' + money0(r.fc.range) + ')' : '') + ', ' + (pct === 0 ? 'level with' : (pct > 0 ? '+' : '') + pct + '% vs') + ' the 4-week average. Households threw out ' + Math.round(r.wr * 100) + '%.</span>' +
      (r.wr > .15 ? '<span class="tag" style="align-self:flex-start;background:var(--soon);color:var(--soonText)">High household waste: smaller packs may sell better</span>' : '') +
      '<div class="meal-foot"><label class="field" style="gap:4px">Your usual order<input class="base" data-base="' + r.c + '" inputmode="decimal" placeholder="$ per week" value="' + b + '"></label>' +
      '<div style="text-align:right"><div class="sub">Suggested</div><b style="font-family:var(--mono);font-size:17px;color:' + (apct < 0 ? 'var(--good)' : 'var(--ink)') + '">' + (b ? money0(b * r.adj) + ' ' : '') + (apct > 0 ? '+' : '') + apct + '%</b></div></div></div>';
  }).join('');
  h += '<p class="note">How this works: each category’s weekly spend is forecast with trend-adjusted smoothing over up to 8 weeks. The suggestion scales your usual order by that forecast, then trims it by half of any household waste above 10%, since food thrown out at home was bought but not needed. Weeks with fewer than ' + MIN_HH + ' sharing households are left out.</p>';
  el.innerHTML = h; bindMarket();
}
function bindMarket() {
  const el = $('#s-market');
  el.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { M.src = b.dataset.src; renderMarket(); });
  el.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => { M.region = b.dataset.reg; renderMarket(); });
  el.querySelectorAll('[data-base]').forEach(i => i.onchange = () => { const v = parseFloat(i.value); if (v > 0) M.baselines[i.dataset.base] = Math.round(v); else delete M.baselines[i.dataset.base]; saveBaselines(); renderMarket(); });
}

/* ---------- render ---------- */
function render(n) { if (n === 0) renderPantry(); else if (n === 1) renderAdd(); else if (n === 2) renderMeals(); else renderMarket(); }
function renderAll() { renderPantry(); renderAdd(); renderMeals(); }
renderAll();
refreshAccess();

/* ---------- account sync ---------- */
(async function sync() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection('data/users/' + id).doc('kitchen');
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.state && (+remote.updatedAt || 0) > (S.updatedAt || 0)) {
      try { S = Object.assign({ items: [], log: [], shopping: [] }, JSON.parse(remote.state)); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      renderAll();
    }
    dbRef = ref; DB = db; USER = user;
    try { canOperate = !!(await Promise.resolve(user.canEdit())); } catch (e) { canOperate = false; }
    if (canOperate) { $('#tab-market').hidden = false; $('nav').classList.add('four'); }
    renderPantry(); queueShare();
    if (S.updatedAt && (!remote || (+remote.updatedAt || 0) < S.updatedAt)) ref.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }).catch(() => {});
  } catch (e) {}
})();
// refresh dates at midnight / when returning to the tab
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(ui.tab); });
})();
